services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flownix
      POSTGRES_PASSWORD: flownix
      POSTGRES_DB: flownix
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["flownix_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flownix"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  flownix_pg:
