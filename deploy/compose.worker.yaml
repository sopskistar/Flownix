# Build from the repository root: docker compose -f deploy/compose.worker.yaml ...
services:
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
      args:
        FLOWNIX_COMMIT_SHA: ${FLOWNIX_COMMIT_SHA:?Set the verified full release SHA}
    image: flownix-worker:${FLOWNIX_COMMIT_SHA}
    env_file: ../.env.worker.runtime
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 90s
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
