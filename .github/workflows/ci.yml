name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: flownix, POSTGRES_PASSWORD: flownix, POSTGRES_DB: flownix }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://flownix:flownix@127.0.0.1:5432/flownix
      ACCESS_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - name: Smoke test the packaged Telegram CLI
        run: |
          docker build -f Dockerfile.worker -t flownix-worker:ci .
          exit_code=0
          output=$(docker run --rm --network none flownix-worker:ci node --import tsx scripts/telegram-test.ts 2>&1) || exit_code=$?
          printf '%s\n' "$output"
          test "$exit_code" -eq 2
          [[ "$output" == "Usage: telegram-test.ts --status UUID"* ]]
          docker run --rm --network host -e DATABASE_URL -e TELEGRAM_ENABLED=false flownix-worker:ci \
            node --import tsx scripts/telegram-test.ts --status 3e6e67a8-06b5-4c42-9d40-a50b04e5680a |
            jq -e '.id == "telegram-test:3e6e67a8-06b5-4c42-9d40-a50b04e5680a" and .status == "not_found"'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Retain synthetic integration screenshots for visual acceptance
        uses: actions/upload-artifact@v7
        with:
          name: integration-visual-acceptance-${{ github.sha }}
          path: artifacts/screenshots/integration-evidence-*.png
          retention-days: 3
          if-no-files-found: error
